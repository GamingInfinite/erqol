[package]
name = "erqol"
version = "0.14.0"
edition = "2024"
repository = "https://github.com/vswarte/eldenring-rs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fromsoftware-shared = { path = "../fromsoftware-rs/crates/shared", package = "fromsoftware-shared" }
eldenring = { path = "../fromsoftware-rs/crates/eldenring", package = "eldenring" }
ilhook = { version = "2.3", features = ["x64"] }
pelite = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory"] }
steamworks-sys = "0.13.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
